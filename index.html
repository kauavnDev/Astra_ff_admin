<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Completo da Fauna e Flora de Guaíba - RS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Cabeçalho Principal -->
  <header class="header">
    <div class="container">
      <h1>🌿 Catálogo da Biodiversidade de Guaíba 🐾</h1>
      <p>Mapeamento interativo das espécies nativas do Lago Guaíba, Banhados, Morros e Bioma Pampa / Mata Atlântica</p>
    </div>
  </header>

  <main class="container">
    
    <!-- Seção de Filtros e Busca -->
    <section class="controls">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por nome popular, nome científico ou ecossistema de Guaíba..." autocomplete="off">
      </div>
      
      <div class="filter-buttons">
        <button class="btn filter-btn active" data-category="todos">Todas as Espécies</button>
        <button class="btn filter-btn" data-category="fauna">🐾 Fauna</button>
        <button class="btn filter-btn" data-category="flora">🌿 Flora</button>
        <button class="btn filter-btn" data-category="ameacadas">⚠️ Ameaçadas / Protegidas</button>
      </div>
    </section>

    <!-- Estatísticas do Catálogo -->
    <div class="stats" id="statsCounter">
      Carregando catálogo de espécies...
    </div>

    <!-- Container onde os cards do dados.json serão renderizados dinamicamente -->
    <section class="grid" id="catalogGrid"></section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; Catálogo de Biodiversidade de Guaíba/RS - Hospedado no GitHub Pages</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
