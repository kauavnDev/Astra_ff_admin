<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodiversidade de Guaíba - RS | Catálogo Oficial</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f381e;
      --primary-light: #2d6a4f;
      --accent: #52b788;
      --bg: #f4f7f5;
      --card-bg: #ffffff;
      --text: #1b263b;
      --text-muted: #6c757d;
      --border: #e2e8f0;
      --fauna: #d97706;
      --flora: #16a34a;
      --warning: #dc2626;
      --protected: #2563eb;
      --radius: 16px;
      --shadow: 0 10px 25px -5px rgba(15, 56, 30, 0.08), 0 8px 10px -6px rgba(15, 56, 30, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Hero Header Sofisticado */
    .hero {
      background: linear-gradient(135deg, #0a2614 0%, var(--primary) 50%, var(--primary-light) 100%);
      color: white;
      padding: 70px 20px;
      text-align: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    .hero::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 40px;
      background: linear-gradient(to top, var(--bg), transparent);
    }

    .hero-content {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .hero h1 {
      font-size: 2.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 12px;
      background: linear-gradient(to right, #ffffff, #b7e4c7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero p {
      font-size: 1.15rem;
      color: #d8f3dc;
      opacity: 0.9;
    }

    /* Container Principal */
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 0 24px;
      width: 100%;
    }

    /* Painel de Controle (Busca e Filtros) */
    .controls-wrapper {
      margin-top: -30px;
      position: relative;
      z-index: 10;
      margin-bottom: 35px;
    }

    .search-card {
      background: white;
      padding: 24px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .search-input-box {
      position: relative;
    }

    .search-input-box input {
      width: 100%;
      padding: 16px 20px 16px 50px;
      font-size: 1.05rem;
      border: 2px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: all 0.3s ease;
      background-color: #fafbfc;
      color: var(--text);
    }

    .search-input-box input:focus {
      border-color: var(--accent);
      background-color: #fff;
      box-shadow: 0 0 0 4px rgba(82, 183, 136, 0.15);
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--text-muted);
    }

    .filter-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 20px;
      border: 1px solid var(--border);
      background-color: #f8fafc;
      color: var(--text);
      border-radius: 30px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-btn:hover {
      background-color: #edf2f7;
      border-color: #cbd5e1;
    }

    .filter-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(15, 56, 30, 0.2);
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    /* Grid de Cards Premium */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 30px;
      margin-bottom: 60px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow);
      border-color: #cbd5e1;
    }

    .card-media {
      position: relative;
      height: 220px;
      overflow: hidden;
      background-color: #e2e8f0;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover .card-img {
      transform: scale(1.05);
    }

    .badges-overlay {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: white;
      backdrop-filter: blur(4px);
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
    }

    .badge.fauna { background-color: var(--fauna); }
    .badge.flora { background-color: var(--flora); }
    .badge.warning { background-color: var(--warning); }
    .badge.protected { background-color: var(--protected); }

    .card-body {
      padding: 22px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 2px;
    }

    .card-scientific {
      font-style: italic;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .card-habitat {
      font-size: 0.85rem;
      color: var(--primary);
      background-color: #e8f5e9;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .card-desc {
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.55;
      margin-top: auto;
    }

    /* Footer */
    .footer {
      margin-top: auto;
      background-color: #ffffff;
      border-top: 1px solid var(--border);
      padding: 30px 0;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    @media (max-width: 768px) {
      .hero h1 { font-size: 2rem; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- Hero Header -->
  <header class="hero">
    <div class="hero-content">
      <h1>🌿 Biodiversidade de Guaíba</h1>
      <p>Catálogo interativo oficial das espécies nativas da fauna e flora do Lago Guaíba, Banhados, Morros e Bioma Pampa.</p>
    </div>
  </header>

  <main class="container">
    
    <!-- Painel de Busca e Filtros Avançado -->
    <section class="controls-wrapper">
      <div class="search-card">
        <div class="search-input-box">
          <span class="search-icon">🔍</span>
          <input type="text" id="searchInput" placeholder="Pesquisar por nome popular, científico, habitat ou descrição..." autocomplete="off">
        </div>
        
        <div class="filter-group" id="filterButtons">
          <button class="filter-btn active" data-category="todos">Todas as Espécies</button>
          <button class="filter-btn" data-category="fauna">🐾 Fauna Nativa</button>
          <button class="filter-btn" data-category="flora">🌿 Flora Nativa</button>
          <button class="filter-btn" data-category="ameacadas">⚠️ Ameaçadas / Protegidas</button>
        </div>
      </div>
    </section>

    <!-- Barra de Estatísticas -->
    <div class="stats-bar">
      <span id="statsCounter">Carregando catálogo...</span>
      <span>RS • Brasil</span>
    </div>

    <!-- Grid de Cards -->
    <section class="grid" id="catalogGrid"></section>

  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2026 Catálogo de Biodiversidade de Guaíba/RS • Desenvolvido para GitHub Pages</p>
    </div>
  </footer>

  <script>
    // Banco de dados integrado (Garante que nunca dê falha de conexão ou erro de JSON)
    const especiesData = [
      {
        id: 1,
        nome: "Capivara",
        cientifico: "Hydrochoerus hydrochaeris",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Margens do Lago Guaíba e Banhados",
        imagem: "https://images.unsplash.com/photo-1534188753412-3e26d0d618d6?w=600",
        descricao: "Maior roedor do mundo, extremamente comum na orla e zonas alagadas de Guaíba. Vive em grupos sociais próximos à água."
      },
      {
        id: 2,
        nome: "Bugio-ruivo",
        cientifico: "Alouatta guariba clamitans",
        categoria: "fauna",
        status: "Vulnerável",
        habitat: "Matas dos Morros de Guaíba",
        imagem: "https://images.unsplash.com/photo-1540573133985-7585fc82864d?w=600",
        descricao: "Primata símbolo das matas nativas gaúchas. Reconhecido pelo vocalizar potente que ecoa pelas copas das árvores nos morros."
      },
      {
        id: 3,
        nome: "Jacaré-de-papo-amarelo",
        cientifico: "Caiman latirostris",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Lagoa, Banhados e Juncais",
        imagem: "https://images.unsplash.com/photo-1516467508483-a7212febe31a?w=600",
        descricao: "Réptil semiaquático habitual dos ecossistemas úmidos de Guaíba. Essencial no equilíbrio populacional de peixes e roedores."
      },
      {
        id: 4,
        nome: "Ratão-do-banhado",
        cientifico: "Myocastor coypus",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Zonas úmidas e margens de rios",
        imagem: "https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=600",
        descricao: "Mamífero semiaquático herbívoro adaptado aos banhados. Possui dentes incisivos alaranjados e membranas nas patas."
      },
      {
        id: 5,
        nome: "Garça-branca-grande",
        cientifico: "Ardea alba",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Orla e águas rasas do Lago Guaíba",
        imagem: "https://images.unsplash.com/photo-1508615070457-7ba34003ab59?w=600",
        descricao: "Ave aquática esbelta com plumagem totalmente branca. Alimenta-se de pequenos peixes e anfíbios em águas rasas."
      },
      {
        id: 6,
        nome: "Quero-quero",
        cientifico: "Vanellus chilensis",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Campos abertos e orla",
        imagem: "https://images.unsplash.com/photo-1522921193457-37d3e921f4d5?w=600",
        descricao: "Ave símbolo do RS. Muito territorial, nidifica no solo e defende agressivamente seu ninho com esporões nas asas."
      },
      {
        id: 7,
        nome: "Graxaim-do-campo",
        cientifico: "Lycalopex gymnocercus",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Bioma Pampa e áreas rurais",
        imagem: "https://images.unsplash.com/photo-1470093851219-69951fcbb533?w=600",
        descricao: "Canídeo nativo de hábitos noturnos e crepusculares. Alimenta-se de pequenos mamíferos, frutos e insetos."
      },
      {
        id: 8,
        nome: "Tachã",
        cientifico: "Chauna torquata",
        categoria: "fauna",
        status: "Pouco Preocupante",
        habitat: "Banhados e campos alagados",
        imagem: "https://images.unsplash.com/photo-1550853024-fae8cd4be47f?w=600",
        descricao: "Grande ave de banhado ruidosa que vive em casais. Possui esporões afiados nas dobras das asas."
      },
      {
        id: 9,
        nome: "Corticeira-do-banhado",
        cientifico: "Erythrina crista-galli",
        categoria: "flora",
        status: "Pouco Preocupante",
        habitat: "Margens de rios e zonas alagáveis",
        imagem: "https://images.unsplash.com/photo-1596701062351-8c2c14d1fdd0?w=600",
        descricao: "Flor símbolo oficial do Rio Grande do Sul. Produz flores vermelhas vivas que alimentam beija-flores locais."
      },
      {
        id: 10,
        nome: "Figueira-da-folha-miúda",
        cientifico: "Ficus organensis",
        categoria: "flora",
        status: "Protegida",
        habitat: "Matas de restinga e morros de Guaíba",
        imagem: "https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?w=600",
        descricao: "Árvore centenária imponente imune ao corte por lei estadual. Suas copas gigantescas abrigam dezenas de espécies."
      },
      {
        id: 11,
        nome: "Pitangueira",
        cientifico: "Eugenia uniflora",
        categoria: "flora",
        status: "Pouco Preocupante",
        habitat: "Mata Atlântica e morros de Guaíba",
        imagem: "https://images.unsplash.com/photo-1501004318641-b39e6451bec6?w=600",
        descricao: "Árvore frutífera nativa que produz a pitanga, fruto rico em vitamina C atrator da avifauna nativa."
      },
      {
        id: 12,
        nome: "Araçá-vermelho",
        cientifico: "Psidium cattleyanum",
        categoria: "flora",
        status: "Pouco Preocupante",
        habitat: "Restingas e encostas dos morros",
        imagem: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600",
        descricao: "Arbusto nativo resistente de frutos avermelhados e adocicados, fonte vital de alimento na época de maturação."
      },
      {
        id: 13,
        nome: "Jerivá",
        cientifico: "Syagrus romanzoffiana",
        categoria: "flora",
        status: "Pouco Preocupante",
        habitat: "Floresta Estacional e encostas de Guaíba",
        imagem: "https://images.unsplash.com/photo-1513836279014-a89f7a76ae86?w=600",
        descricao: "Palmeira nativa abundante no RS. Seus coquinhos amarelos alimentam bugios, papagaios e pequenos mamíferos."
      },
      {
        id: 14,
        nome: "Guabirobeira",
        cientifico: "Campomanesia xanthocarpa",
        categoria: "flora",
        status: "Pouco Preocupante",
        habitat: "Matas ciliares e encostas de Guaíba",
        imagem: "https://images.unsplash.com/photo-1448375240586-882707db888b?w=600",
        descricao: "Árvore de grande porte com casca sulcada. Frutos amarelos aromáticos e muito saborosos."
      },
      {
        id: 15,
        nome: "Aguapé / Jacinto-d'água",
        cientifico: "Eichhornia crassipes",
        categoria: "flora",
        status: "Pouco Preocupante",
        habitat: "Superfície da água do Lago Guaíba e canais",
        imagem: "https://images.unsplash.com/photo-1508615070457-7ba34003ab59?w=600",
        descricao: "Planta aquática flutuante com flores roxas. Funciona como filtro natural da água e berçário para a fauna aquática."
      }
    ];

    const catalogGrid = document.getElementById('catalogGrid');
    const searchInput = document.getElementById('searchInput');
    const filterButtons = document.querySelectorAll('.filter-btn');
    const statsCounter = document.getElementById('statsCounter');
    let activeFilter = 'todos';

    function renderCatalog() {
      const query = searchInput.value.toLowerCase().trim();

      const filtered = especiesData.filter(item => {
        let matchesCategory = false;
        if (activeFilter === 'todos') {
          matchesCategory = true;
        } else if (activeFilter === 'ameacadas') {
          matchesCategory = item.status === 'Vulnerável' || item.status === 'Protegida';
        } else {
          matchesCategory = item.categoria === activeFilter;
        }

        const matchesSearch = query === '' ||
          item.nome.toLowerCase().includes(query) ||
          item.cientifico.toLowerCase().includes(query) ||
          item.habitat.toLowerCase().includes(query) ||
          item.descricao.toLowerCase().includes(query);

        return matchesCategory && matchesSearch;
      });

      statsCounter.innerHTML = filtered.length === 0 
        ? '⚠️ Nenhuma espécie encontrada.' 
        : `Exibindo <strong>${filtered.length}</strong> de <strong>${especiesData.length}</strong> espécies cadastradas`;

      catalogGrid.innerHTML = filtered.map(item => {
        const badgeClass = item.categoria === 'fauna' ? 'fauna' : 'flora';
        let statusBadge = '';
        
        if (item.status && item.status !== 'Pouco Preocupante') {
          const statusClass = item.status === 'Vulnerável' ? 'warning' : 'protected';
          statusBadge = `<span class="badge ${statusClass}">${item.status}</span>`;
        }

        return `
          <article class="card">
            <div class="card-media">
              <div class="badges-overlay">
                <span class="badge ${badgeClass}">${item.categoria}</span>
                ${statusBadge}
              </div>
              <img class="card-img" src="${item.imagem}" alt="${item.nome}" loading="lazy" onerror="this.src='https://via.placeholder.com/600x400?text=Sem+Imagem'">
            </div>
            <div class="card-body">
              <h3 class="card-title">${item.nome}</h3>
              <p class="card-scientific">${item.cientifico}</p>
              <div class="card-habitat">📍 ${item.habitat}</div>
              <p class="card-desc">${item.descricao}</p>
            </div>
          </article>
        `;
      }).join('');
    }

    searchInput.addEventListener('input', renderCatalog);

    filterButtons.forEach(button => {
      button.addEventListener('click', () => {
        filterButtons.forEach(btn => btn.classList.remove('active'));
        button.classList.add('active');
        activeFilter = button.getAttribute('data-category');
        renderCatalog();
      });
    });

    // Inicializa o site
    renderCatalog();
  </script>
</body>
</html>
